name: BridgeHome
options:
  bundleIdPrefix: org.bridgehome
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BridgeHome:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BridgeHome
    settings:
      base:
        PRODUCT_NAME: BridgeHome
        PRODUCT_BUNDLE_IDENTIFIER: org.bridgehome.BridgeHome
        INFOPLIST_KEY_CFBundleDisplayName: "BridgeHome"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"

  BridgeHomeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BridgeHomeTests
    dependencies:
      - target: BridgeHome
    settings:
      base:
        PRODUCT_NAME: BridgeHomeTests
        PRODUCT_BUNDLE_IDENTIFIER: org.bridgehome.BridgeHomeTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
